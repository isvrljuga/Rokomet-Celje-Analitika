    .lv-chip{min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid #d8e0da;background:#fff;font-weight:800;color:var(--ink)}.lv-chip.bad{background:#f8e6e3;border-color:#e6c2bb;color:#7a2a21}.lv-chip.go{background:var(--lime);border-color:#b3d460;color:var(--green)}.lv-chip.sel{background:var(--green);border-color:var(--green);color:#fff}.lv-chip:disabled{opacity:.4}
    .lv-exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
    .lv-excard{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1.5px solid #e6c2bb;background:#faeeec;border-radius:14px;padding:10px 12px}.lv-excard.done{background:#fdf3e1;border-color:#e0a23a}.lv-excard.sel{outline:3px solid var(--green)}
    .lv-exname{flex:1;min-width:0;display:flex;flex-direction:column}.lv-exname small{color:#56645e;font-weight:600}
    .lv-exleft{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;color:#7a2a21}.lv-excard.done .lv-exleft{font-size:15px;color:#8a5a0c}
    @media(max-width:899px){
      .lv-score{font-size:32px}.lv-clockbar{flex-basis:100%;justify-content:space-between;gap:6px}.lv-clock{flex:1;min-width:0}.lv-play{min-width:52px}.lv-txt{display:none}.lv-seg button{padding:0 9px}.lv-tb{min-width:44px}
      .lv-crumbs{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
      .lv-crumbs button{flex:1 1 0;min-width:0;min-height:44px;border:1.5px solid #dfe5df;background:#f8faf7;border-radius:11px;padding:0 6px;font-weight:700;font-size:13px;color:#56645e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .lv-crumbs button.cur{border-color:var(--green);color:var(--green);background:#fff}.lv-crumbs button.done{background:var(--green);border-color:var(--green);color:#fff}
      .lv-body{display:block;overflow:auto;padding:12px}
      .lv-col{display:none;border:0;background:transparent;padding:0;overflow:visible}
      .lv.step-1 .lv-c1,.lv.step-2 .lv-c2,.lv.step-3 .lv-c3{display:flex}
      .lv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.lv-tile{background:#fff}.lv-tile b{font-size:14px}.lv-tile.opp{grid-column:auto}
      .lv-keeper{order:-1;margin:0}.lv-kseg{background:#fff;border:1px solid var(--line)}
      .lv-acts{grid-template-columns:repeat(2,minmax(0,1fr))}.lv-act{min-height:70px;background:#fff}.lv-opt{background:#fff}
      .lv-c3 .lv-selchip{display:none}.lv-loglabel,.lv-ev.more{display:none}.lv-btn{padding:0}
      .lv-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
      .lv.scr-subs .lv-crumbs,.lv.scr-lineup .lv-crumbs{display:none}.lv-subs{grid-template-columns:minmax(0,1fr)}.lv-sec{padding:12px}
    }
  </style>
</head>

<div class="shell">

</div>

  <button data-view="matches" class="active"><i>▦</i>Tekme</button><button data-view="overview"><i>◫</i>Pregled</button><button data-view="roster"><i>♙</i>Ekipa</button><button data-view="exports"><i>⇩</i>Izvoz</button>

<script src="app.js"></script>
<script src="live.js"></script>
