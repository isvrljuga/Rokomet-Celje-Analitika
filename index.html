<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="crest">C</div><div><b>Rokomet Celje</b><small>Analitika tekem</small></div></div>
    <nav class="nav" aria-label="Glavna navigacija">
      <button data-view="matches" class="active"><i>▦</i> Tekme</button>
      <button data-view="overview"><i>◫</i> Skupni pregled</button>
      <button data-view="roster"><i>♙</i> Ekipa in igralke</button>
      <button data-view="exports"><i>⇩</i> Izvoz in varnostna kopija</button>
    </nav>
    <div class="side-note">Podatki se shranjujejo v tem brskalniku.<br>Redno izvozi varnostno kopijo.</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="team-switch" role="tablist" aria-label="Ekipa">
        <button data-team="members" class="active">Članice</button><button data-team="juniors">Mladinke</button>
      </div>
      <div class="top-actions"><span class="connection"><span class="dot"></span> Shranjeno v napravi</span><button class="btn small" id="installBtn" hidden>Namesti aplikacijo</button></div>
    </header>
    <div class="content">
      <section id="view-matches" class="view active"></section>
      <section id="view-overview" class="view"></section>
      <section id="view-roster" class="view"></section>
      <section id="view-exports" class="view"></section>
      <section id="view-game" class="view"></section>
    </div>
  </main>
</div>
<nav class="mobile-nav" aria-label="Glavna navigacija">
  <button data-view="matches" class="active"><i>▦</i>Tekme</button><button data-view="overview"><i>◫</i>Pregled</button><button data-view="roster"><i>♙</i>Ekipa</button><button data-view="exports"><i>⇩</i>Izvoz</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
